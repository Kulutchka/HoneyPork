<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HoneyPork - Login</title>
  <link rel="stylesheet" href="/static/style.css">
  <script>
    (function () {
      try {
        if (localStorage.getItem("honeypork-theme") === "light") {
          document.documentElement.setAttribute("data-theme", "light");
        }
      } catch (e) {}
    })();
  </script>
</head>
<body class="login-body">
  <button class="icon-btn login-theme-toggle" id="theme-toggle" aria-label="Toggle light/dark mode" title="Toggle theme">
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>
  <div class="login-card">
    <div class="login-logo-wrap">
      <img src="/static/logo_transparent.png" alt="HoneyPork">
    </div>
    <p class="subtitle">Honeypot &amp; IDS console</p>
    <form method="post" action="/login">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" type="text" name="username" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" name="password" autocomplete="current-password" required>
      </div>
      <button class="btn primary" type="submit">Sign in</button>
    </form>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
  </div>
  <script>
    (function () {
      var btn = document.getElementById("theme-toggle");
      if (!btn) return;
      btn.addEventListener("click", function () {
        var isLight = document.documentElement.getAttribute("data-theme") === "light";
        var next = isLight ? "dark" : "light";
        if (next === "light") {
          document.documentElement.setAttribute("data-theme", "light");
        } else {
          document.documentElement.removeAttribute("data-theme");
        }
        try { localStorage.setItem("honeypork-theme", next); } catch (e) {}
      });
    })();
  </script>
</body>
</html>
